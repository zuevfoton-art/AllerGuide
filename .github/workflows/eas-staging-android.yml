name: EAS staging Android

# Preferred CI path for stage APK (Google pollen heatmap).
# Does NOT install Android SDK on the runner — Expo cloud builds the binary.
# Docs: docs/android-stage-build.md

on:
  workflow_dispatch:
    inputs:
      wait:
        description: 'Wait for EAS build to finish (true/false)'
        required: true
        default: 'true'
        type: choice
        options:
          - 'true'
          - 'false'
  # Tag path when workflow_dispatch is unavailable (same idea as staging-apk-gradle.yml).
  push:
    tags:
      - 'eas-staging-*'

concurrency:
  group: eas-staging-android
  cancel-in-progress: false

jobs:
  eas-android:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Require EXPO_TOKEN
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          if [ -z "${EXPO_TOKEN}" ]; then
            echo "::error::Set repository secret EXPO_TOKEN (expo.dev → Access tokens)."
            echo "Maps key belongs in EAS project secrets as EXPO_PUBLIC_GOOGLE_MAPS_API_KEY."
            echo "See docs/android-stage-build.md"
            exit 1
          fi

      # Run 34365896778: tarball uploaded, then eas-cli exited 1 —
      # "used its Android builds from the Free plan this month" (reset 2026-10-01).
      # Other EAS/Gradle errors still fail the job. APK fallback: staging-apk-gradle.yml.
      - name: EAS Build staging Android
        id: eas_android
        working-directory: apps/mobile
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          WAIT_FLAG=""
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.wait }}" = "false" ]; then
            WAIT_FLAG="--no-wait"
          fi
          # eas-cli 16.x on this runner fails tarball upload:
          # "Cannot read properties of undefined (reading 'create')".
          set +e
          npx --yes eas-cli@22.0.0 build \
            --profile staging \
            --platform android \
            --non-interactive \
            ${WAIT_FLAG} 2>&1 | tee /tmp/eas-android.log
          status="${PIPESTATUS[0]}"
          set -e
          if [ "$status" -eq 0 ]; then
            echo "quota=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if grep -q 'Free plan this month' /tmp/eas-android.log; then
            echo "quota=true" >> "$GITHUB_OUTPUT"
            echo "::warning::EAS Free-plan Android quota (resets on the 1st). Upload may have succeeded; the cloud build did not start."
            echo "::warning::APK without Expo cloud: Actions → Staging Android APK (Gradle) · docs/android-stage-build.md §C"
            exit 0
          fi
          exit "$status"

      - name: Next steps
        if: success()
        run: |
          if [ "${{ steps.eas_android.outputs.quota }}" = "true" ]; then
            echo "::notice::No EAS APK this run (Free-plan quota). Use Staging Android APK (Gradle) or retry after billing reset / a paid plan."
          else
            echo "::notice::APK appears on expo.dev → Project → Builds (profile staging)."
            echo "Ensure EAS preview env has Sensitive EXPO_PUBLIC_GOOGLE_MAPS_API_KEY (AIza…)."
            echo "Staging/preview APK is signed with debug.keystore SHA-1 5E:8F:16:06:2E:A3:CD:2C:4A:0D:54:78:76:BA:A6:F3:8C:AB:F6:25."
            echo "API must have POLLEN_HEATMAP_ENABLED=true + GOOGLE_POLLEN_API_KEY."
          fi
          echo "Docs: docs/android-stage-build.md"
