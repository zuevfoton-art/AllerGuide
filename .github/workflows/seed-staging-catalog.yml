name: Seed staging catalog

# Writes reference rows into YC Managed Postgres (private VPC).
# Allergens + food-allergy products + bundled marketplace seed.
# Trigger: tag catalog-seed-* (workflow_dispatch is often 403 from this integration).

on:
  workflow_dispatch:
  push:
    tags:
      - "catalog-seed-*"

env:
  NODE_VERSION: "20"
  PNPM_VERSION: "10.34.4"

jobs:
  seed:
    runs-on: [self-hosted, yc-staging-vpc]
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Apply migrations
        env:
          DATABASE_URL: ${{ secrets.STAGING_DATABASE_URL }}
          DIRECT_DATABASE_URL: ${{ secrets.STAGING_DIRECT_DATABASE_URL }}
          DB_SSL: require
        run: pnpm --filter api db:migrate

      # Staging journal can mark 0005 applied while catalog.products still lacks brand/image_url
      # (WebSQL: barcode/name/ingredients/allergen_tags/source/updated_at/trace_tags).
      - name: Ensure catalog.products OFF columns
        env:
          DATABASE_URL: ${{ secrets.STAGING_DATABASE_URL }}
          DIRECT_DATABASE_URL: ${{ secrets.STAGING_DIRECT_DATABASE_URL }}
          DB_SSL: require
        run: pnpm --filter api db:ensure-product-columns

      - name: Seed allergens
        env:
          DATABASE_URL: ${{ secrets.STAGING_DATABASE_URL }}
          DIRECT_DATABASE_URL: ${{ secrets.STAGING_DIRECT_DATABASE_URL }}
          DB_SSL: require
        run: pnpm --filter api db:seed-allergens

      - name: Import food-allergy products
        env:
          DATABASE_URL: ${{ secrets.STAGING_DATABASE_URL }}
          DIRECT_DATABASE_URL: ${{ secrets.STAGING_DIRECT_DATABASE_URL }}
          DB_SSL: require
        run: pnpm --filter api db:import-food-allergy

      - name: Seed bundled dishes
        env:
          DATABASE_URL: ${{ secrets.STAGING_DATABASE_URL }}
          DIRECT_DATABASE_URL: ${{ secrets.STAGING_DIRECT_DATABASE_URL }}
          DB_SSL: require
        run: pnpm --filter api db:seed-dishes

      - name: Seed bundled marketplace catalog
        env:
          DATABASE_URL: ${{ secrets.STAGING_DATABASE_URL }}
          DIRECT_DATABASE_URL: ${{ secrets.STAGING_DIRECT_DATABASE_URL }}
          DB_SSL: require
        run: pnpm --filter api db:seed-market
