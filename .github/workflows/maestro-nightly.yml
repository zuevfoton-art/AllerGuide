name: Maestro Nightly

# P2.1c — nightly Maestro E2E (offline preview + staging auth/backup with local API).
#
# APK must be assembleRelease (embedded JS). assembleDebug skips the Metro bundle
# and the first flow dies on `auth-register-link` (~45s) with no login screen.
on:
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:

concurrency:
  group: maestro-nightly
  cancel-in-progress: false

permissions:
  contents: read

env:
  MAESTRO_VERSION: '2.8.0'
  MAESTRO_DRIVER_STARTUP_TIMEOUT: '120000'
  MAESTRO_CLI_NO_ANALYTICS: '1'

jobs:
  maestro-offline:
    name: Offline smoke (preview)
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: |
          yes | sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0" >/dev/null

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build preview APK
        run: ./scripts/maestro-build-apk.sh preview

      - name: Install Maestro
        run: |
          curl -Ls "https://get.maestro.mobile.dev" | MAESTRO_VERSION="${MAESTRO_VERSION}" bash
          echo "$HOME/.maestro/bin" >> "$GITHUB_PATH"

      - name: Run offline Maestro flows
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          avd-name: maestro-avd-34
          emulator-boot-timeout: 900
          emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          script: ./scripts/maestro-run-emulator.sh preview

      - name: Upload Maestro report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: maestro-offline-report
          path: |
            maestro-offline-report.xml
            maestro-offline-debug
            maestro-offline-logcat.txt
            maestro-offline-screen.png
            maestro-offline-during.png
            maestro-offline-during-focus.txt
            maestro-offline-ui.xml
          if-no-files-found: ignore

  maestro-staging:
    name: Staging smoke (auth + backup)
    runs-on: ubuntu-latest
    timeout-minutes: 90
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: allerguide
          POSTGRES_PASSWORD: allerguide
          POSTGRES_DB: allerguide_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U allerguide -d allerguide_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: |
          yes | sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0" >/dev/null

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Start API for staging E2E
        env:
          DATABASE_URL: postgresql://allerguide:allerguide@localhost:5432/allerguide_test?sslmode=disable
          DIRECT_DATABASE_URL: postgresql://allerguide:allerguide@localhost:5432/allerguide_test?sslmode=disable
        run: ./scripts/maestro-start-api.sh

      - name: Build staging APK
        env:
          MAESTRO_API_URL: http://10.0.2.2:3001
        run: ./scripts/maestro-build-apk.sh staging

      - name: Install Maestro
        run: |
          curl -Ls "https://get.maestro.mobile.dev" | MAESTRO_VERSION="${MAESTRO_VERSION}" bash
          echo "$HOME/.maestro/bin" >> "$GITHUB_PATH"

      - name: Run staging Maestro flows
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          avd-name: maestro-avd-34
          emulator-boot-timeout: 900
          emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          script: ./scripts/maestro-run-emulator.sh staging

      - name: Upload Maestro report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: maestro-staging-report
          path: |
            maestro-staging-report.xml
            maestro-staging-debug
            maestro-staging-logcat.txt
            maestro-staging-screen.png
            maestro-staging-during.png
            maestro-staging-during-focus.txt
            maestro-staging-ui.xml
          if-no-files-found: ignore

      - name: API log on failure
        if: failure()
        run: |
          tail -100 "${TMPDIR:-/tmp}/maestro-api.log" || true
