name: Neon preview branch

# Creates an ephemeral Neon database branch per pull request, runs the API
# migrations and tests against that isolated copy, and deletes the branch when
# the PR closes. Requires the following repo configuration:
#   - secret  NEON_API_KEY     (Neon API key)
#   - variable NEON_PROJECT_ID (Neon project id)
# The jobs no-op when NEON_API_KEY is not configured, so forks/unset repos pass.

on:
  pull_request:
    types: [opened, reopened, synchronize, closed]

concurrency:
  group: neon-preview-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  migrate-and-test:
    if: ${{ github.event.action != 'closed' && secrets.NEON_API_KEY != '' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Create Neon branch
        id: branch
        uses: neondatabase/create-branch-action@v5
        with:
          project_id: ${{ vars.NEON_PROJECT_ID }}
          branch_name: preview/pr-${{ github.event.pull_request.number }}
          api_key: ${{ secrets.NEON_API_KEY }}

      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Apply migrations + seed catalog against the Neon branch
        env:
          # create-branch-action returns pooled + direct connection strings
          DATABASE_URL: ${{ steps.branch.outputs.db_url_with_pooler }}
          DIRECT_DATABASE_URL: ${{ steps.branch.outputs.db_url }}
          DB_SSL: require
          DB_PREPARE: 'false'
        run: |
          pnpm --filter api db:migrate
          pnpm --filter api db:seed-allergens

      - name: Run tests
        env:
          DATABASE_URL: ${{ steps.branch.outputs.db_url_with_pooler }}
          DIRECT_DATABASE_URL: ${{ steps.branch.outputs.db_url }}
          DB_SSL: require
          DB_PREPARE: 'false'
        run: pnpm test

  cleanup:
    if: ${{ github.event.action == 'closed' && secrets.NEON_API_KEY != '' }}
    runs-on: ubuntu-latest
    steps:
      - name: Delete Neon branch
        uses: neondatabase/delete-branch-action@v3
        with:
          project_id: ${{ vars.NEON_PROJECT_ID }}
          branch: preview/pr-${{ github.event.pull_request.number }}
          api_key: ${{ secrets.NEON_API_KEY }}
