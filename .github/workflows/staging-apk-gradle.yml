name: Staging Android APK (Gradle on GitHub)

# Alternative to EAS: install Android SDK on the runner and assemble a staging APK.
# Prefer docs/android-stage-build.md path A/B (EAS) unless you need a GitHub Release asset.
# Docs: docs/android-stage-build.md §C

on:
  workflow_dispatch:
    inputs:
      upload_artifact:
        description: 'Upload APK as workflow artifact'
        required: true
        default: true
        type: boolean

concurrency:
  group: staging-apk-gradle
  cancel-in-progress: true

jobs:
  build-staging-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: |
          yes | sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0" "ndk;27.1.12297006" >/dev/null

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate assets
        working-directory: apps/mobile
        run: pnpm generate-assets || true

      - name: Prebuild Android (inject Google Maps key via app.config.js)
        working-directory: apps/mobile
        env:
          EXPO_PUBLIC_GOOGLE_MAPS_API_KEY: ${{ secrets.EXPO_PUBLIC_GOOGLE_MAPS_API_KEY }}
          EXPO_PUBLIC_POLLEN_HEATMAP: google
          EXPO_PUBLIC_API_URL: https://api.staging.aclearo.com
          EXPO_PUBLIC_BACKEND_AUTH: 'true'
          EXPO_PUBLIC_APP_ENV: staging
        run: |
          if [ -z "${EXPO_PUBLIC_GOOGLE_MAPS_API_KEY}" ]; then
            echo "::warning::EXPO_PUBLIC_GOOGLE_MAPS_API_KEY secret is empty — Google basemap will be blank; Yandex pollen fallback still works in JS when key missing at runtime."
          fi
          npx expo prebuild --platform android --clean --no-install

      - name: Assemble release APK
        working-directory: apps/mobile/android
        env:
          EXPO_PUBLIC_GOOGLE_MAPS_API_KEY: ${{ secrets.EXPO_PUBLIC_GOOGLE_MAPS_API_KEY }}
        run: ./gradlew assembleRelease --no-daemon

      - name: Stage APK
        run: |
          mkdir -p dist
          cp apps/mobile/android/app/build/outputs/apk/release/app-release.apk \
            "dist/AllerGuide-staging-${{ github.run_number }}.apk"
          ls -lh dist/

      - name: Upload artifact
        if: ${{ inputs.upload_artifact }}
        uses: actions/upload-artifact@v4
        with:
          name: allerguide-staging-apk
          path: dist/*.apk
          if-no-files-found: error
          retention-days: 14
