name: Staging Android APK (Gradle on GitHub)

# Alternative to EAS: install Android SDK on the runner and assemble a staging APK.
# Prefer docs/android-stage-build.md path A/B (EAS) unless you need a GitHub artifact.
# Docs: docs/android-stage-build.md §C
#
# Triggers:
#   - workflow_dispatch (Actions UI)
#   - push tag android-staging-* (CI path when workflow_dispatch is unavailable)

on:
  workflow_dispatch:
    inputs:
      upload_artifact:
        description: 'Upload APK as workflow artifact'
        required: true
        default: true
        type: boolean
  push:
    tags:
      - 'android-staging-*'

concurrency:
  group: staging-apk-gradle
  cancel-in-progress: true

permissions:
  contents: write

env:
  # Keep in sync with apps/mobile/eas.json → build.staging.env
  EXPO_PUBLIC_API_URL: https://api.staging.aclearo.com
  EXPO_PUBLIC_BACKEND_AUTH: 'true'
  EXPO_PUBLIC_CLOUD_SYNC: 'true'
  EXPO_PUBLIC_AI_SCAN_ENABLED: 'true'
  EXPO_PUBLIC_AI_DISH_VISION: 'true'
  EXPO_PUBLIC_YC_OCR: 'true'
  EXPO_PUBLIC_YC_SCAN_INTENT_LLM: 'true'
  EXPO_PUBLIC_YC_SEARCH: 'true'
  EXPO_PUBLIC_YC_STT: 'true'
  EXPO_PUBLIC_YC_STT_MIC: 'true'
  EXPO_PUBLIC_PRODUCT_DB: 'false'
  EXPO_PUBLIC_POLLEN_HEATMAP: google
  EXPO_PUBLIC_GOOGLE_MAP_PRIMARY: 'true'
  EXPO_PUBLIC_MAP_POLLEN_GOOGLE_PRIMARY: 'true'
  EXPO_PUBLIC_MAP_POLLEN_PLUME: 'true'
  EXPO_PUBLIC_YANDEX_MAP_INTERACTIVE: 'true'
  EXPO_PUBLIC_ANALYTICS_ENABLED: 'true'
  EXPO_PUBLIC_APP_ENV: staging
  EXPO_PUBLIC_MAESTRO_TEST_RECOVERY_KEY: bbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbb
  NODE_OPTIONS: --max-old-space-size=8192

jobs:
  build-staging-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: |
          yes | sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0" "ndk;27.1.12297006" >/dev/null

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate assets
        working-directory: apps/mobile
        run: pnpm generate-assets || true

      # Google basemap/heatmap needs a real Maps Android key (AIza…) in the JS bundle
      # and native manifest. Prefer GH secret; otherwise pull from EAS.
      # Never bake CLI/auth error text into the APK (blank map + Google logo).
      - name: Resolve Google Maps API key
        working-directory: apps/mobile
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          EXPO_PUBLIC_GOOGLE_MAPS_API_KEY: ${{ secrets.EXPO_PUBLIC_GOOGLE_MAPS_API_KEY }}
        run: |
          set -euo pipefail

          is_google_maps_api_key() {
            # Google API keys are AIza… (typically 39 chars). Reject spaces / error prose.
            [[ "${1:-}" =~ ^AIza[0-9A-Za-z_-]{20,}$ ]]
          }

          KEY=""
          SOURCE=""
          CANDIDATE="${EXPO_PUBLIC_GOOGLE_MAPS_API_KEY:-}"
          if is_google_maps_api_key "$CANDIDATE"; then
            KEY="$CANDIDATE"
            SOURCE="github-secret"
            echo "Using valid EXPO_PUBLIC_GOOGLE_MAPS_API_KEY from GitHub Actions secrets."
          elif [ -n "${CANDIDATE}" ]; then
            echo "::warning::GitHub secret EXPO_PUBLIC_GOOGLE_MAPS_API_KEY is set but is not a Google API key (expected AIza…)."
          fi

          if [ -z "$KEY" ] && [ -n "${EXPO_TOKEN:-}" ]; then
            echo "Trying EAS project env for Maps key…"
            for ENV_NAME in preview production development; do
              set +e
              VAL="$(
                pnpm exec eas env:get "$ENV_NAME" \
                  --variable-name EXPO_PUBLIC_GOOGLE_MAPS_API_KEY \
                  --format short \
                  --non-interactive 2>/tmp/eas-maps-key.err | tr -d '\r'
              )"
              EAS_RC=$?
              set -e
              VAL="$(printf '%s' "${VAL:-}" | tail -n 1 | tr -d '[:space:]')"
              if [ "$EAS_RC" -ne 0 ]; then
                echo "EAS env:get ${ENV_NAME} failed (rc=${EAS_RC}): $(tr '\n' ' ' </tmp/eas-maps-key.err | head -c 200)"
                continue
              fi
              if is_google_maps_api_key "$VAL"; then
                KEY="$VAL"
                SOURCE="eas:${ENV_NAME}"
                echo "Resolved valid Maps key from EAS environment=${ENV_NAME}."
                break
              fi
              if [ -n "${VAL}" ]; then
                echo "::warning::EAS ${ENV_NAME} returned a non-key value (len=${#VAL}); ignoring."
              fi
            done
          fi

          if [ -n "$KEY" ]; then
            {
              echo "EXPO_PUBLIC_GOOGLE_MAPS_API_KEY<<EOF"
              echo "$KEY"
              echo "EOF"
              echo "STAGING_MAPS_KEY_SOURCE=${SOURCE}"
            } >> "$GITHUB_ENV"
            echo "Google basemap enabled (source=${SOURCE})."
            echo "Gradle CI signing SHA-1 (add to GCP Android key restrictions): 5E:8F:16:06:2E:A3:CD:2C:4A:0D:54:78:76:BA:A6:F3:8C:AB:F6:25"
          else
            {
              echo "EXPO_PUBLIC_GOOGLE_MAPS_API_KEY="
              echo "STAGING_MAPS_KEY_SOURCE=none"
            } >> "$GITHUB_ENV"
            echo "::warning::No valid Google Maps API key (AIza…). APK will use Yandex interactive basemap; Google pollen numbers still work via staging API."
            echo "Set repo secret EXPO_PUBLIC_GOOGLE_MAPS_API_KEY to a Maps Android key, and allowlist package com.aclearo.app + SHA-1 5E:8F:16:06:2E:A3:CD:2C:4A:0D:54:78:76:BA:A6:F3:8C:AB:F6:25 (debug.keystore)."
            echo "See docs/gcp-pollen-maps-keys.md §3.1 / §5 and docs/android-stage-build.md §C."
          fi

      # Prefer committed apps/mobile/android (monorepo Gradle + ExpoReactHostFactory).
      # `prebuild --clean` wiped that wiring and produced a non-launching SDK 55 APK
      # (1.0.13). Maps key is injected via manifestPlaceholders + EXPO_PUBLIC_GOOGLE_MAPS_API_KEY.
      - name: Verify committed native host
        working-directory: apps/mobile
        run: |
          set -euo pipefail
          MAIN_APP="android/app/src/main/java/com/aclearo/app/MainApplication.kt"
          MANIFEST="android/app/src/main/AndroidManifest.xml"
          GRADLE="android/app/build.gradle"
          grep -q 'ExpoReactHostFactory.getDefaultReactHost' "$MAIN_APP"
          grep -q 'bundleConfig = file("${projectRoot}/metro.config.js")' "$GRADLE"
          grep -q 'entryFile = file("${projectRoot}/index.js")' "$GRADLE"
          test -f index.js
          grep -q 'com.google.android.geo.API_KEY' "$MANIFEST"
          grep -q 'GOOGLE_MAPS_API_KEY' "$GRADLE"
          echo "Native host OK (committed android/; maps key via Gradle manifestPlaceholders; entry=index.js)"

      - name: Assemble release APK
        working-directory: apps/mobile/android
        env:
          # Required so Expo/Metro embed EXPO_PUBLIC_* as production release values.
          NODE_ENV: production
        # Job/workflow EXPO_PUBLIC_* + Maps key from prior step (GITHUB_ENV) must be
        # present for Metro embed + android/app/build.gradle manifestPlaceholders.
        run: ./gradlew assembleRelease --no-daemon

      - name: Stage APK
        id: stage
        run: |
          mkdir -p dist
          SHORT_SHA="$(echo '${{ github.sha }}' | cut -c1-7)"
          if [[ "${{ github.ref_type }}" == "tag" ]]; then
            NAME="AllerGuide-staging-${{ github.ref_name }}-${SHORT_SHA}.apk"
          else
            NAME="AllerGuide-staging-${{ github.run_number }}-${SHORT_SHA}.apk"
          fi
          cp apps/mobile/android/app/build/outputs/apk/release/app-release.apk "dist/${NAME}"
          ls -lh dist/
          echo "apk_name=${NAME}" >> "$GITHUB_OUTPUT"

      - name: Upload artifact
        if: ${{ github.event_name == 'push' || inputs.upload_artifact }}
        uses: actions/upload-artifact@v4
        with:
          name: allerguide-staging-apk
          path: dist/*.apk
          if-no-files-found: error
          retention-days: 14

      - name: Publish GitHub Release (tag builds)
        if: startsWith(github.ref, 'refs/tags/android-staging-')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.apk
          name: A-Claro staging Android ${{ github.ref_name }}
          body: |
            Staging APK built from `${{ github.sha }}` via Gradle on GitHub Actions.

            - Profile env aligned with `eas.json` → `staging` (Google pollen / plume / Yandex interactive)
            - Google Maps key source: must be a real `AIza…` key (GH secret or EAS); otherwise Yandex interactive basemap
            - CI signing SHA-1 for GCP Android key allowlist: `5E:8F:16:06:2E:A3:CD:2C:4A:0D:54:78:76:BA:A6:F3:8C:AB:F6:25`
            - Package: `com.aclearo.app` · API: `https://api.staging.aclearo.com`
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
