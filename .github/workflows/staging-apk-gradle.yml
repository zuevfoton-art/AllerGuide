name: Staging Android APK (Gradle on GitHub)

# Alternative to EAS: install Android SDK on the runner and assemble a staging APK.
# Prefer docs/android-stage-build.md path A/B (EAS) unless you need a GitHub artifact.
# Docs: docs/android-stage-build.md §C
#
# Triggers:
#   - workflow_dispatch (Actions UI)
#   - push tag android-staging-* (CI path when workflow_dispatch is unavailable)

on:
  workflow_dispatch:
    inputs:
      upload_artifact:
        description: 'Upload APK as workflow artifact'
        required: true
        default: true
        type: boolean
  push:
    tags:
      - 'android-staging-*'

concurrency:
  group: staging-apk-gradle
  cancel-in-progress: true

permissions:
  contents: write

env:
  # Keep in sync with apps/mobile/eas.json → build.staging.env
  EXPO_PUBLIC_API_URL: https://api.staging.aclearo.com
  EXPO_PUBLIC_BACKEND_AUTH: 'true'
  EXPO_PUBLIC_CLOUD_SYNC: 'true'
  EXPO_PUBLIC_AI_SCAN_ENABLED: 'true'
  EXPO_PUBLIC_YC_OCR: 'true'
  EXPO_PUBLIC_YC_SCAN_INTENT_LLM: 'true'
  EXPO_PUBLIC_YC_SEARCH: 'true'
  EXPO_PUBLIC_YC_STT: 'true'
  EXPO_PUBLIC_PRODUCT_DB: 'false'
  EXPO_PUBLIC_POLLEN_HEATMAP: google
  EXPO_PUBLIC_GOOGLE_MAP_PRIMARY: 'true'
  EXPO_PUBLIC_MAP_POLLEN_GOOGLE_PRIMARY: 'true'
  EXPO_PUBLIC_MAP_POLLEN_PLUME: 'true'
  EXPO_PUBLIC_YANDEX_MAP_INTERACTIVE: 'true'
  EXPO_PUBLIC_ANALYTICS_ENABLED: 'true'
  EXPO_PUBLIC_APP_ENV: staging
  EXPO_PUBLIC_MAESTRO_TEST_RECOVERY_KEY: bbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbb
  NODE_OPTIONS: --max-old-space-size=8192

jobs:
  build-staging-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: |
          yes | sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0" "ndk;27.1.12297006" >/dev/null

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate assets
        working-directory: apps/mobile
        run: pnpm generate-assets || true

      # Google pollen heatmap needs EXPO_PUBLIC_GOOGLE_MAPS_API_KEY in the JS bundle
      # and native Maps config. Prefer GH secret; otherwise pull from EAS (same store
      # as profile staging / eas-staging-android.yml).
      - name: Resolve Google Maps API key
        working-directory: apps/mobile
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          EXPO_PUBLIC_GOOGLE_MAPS_API_KEY: ${{ secrets.EXPO_PUBLIC_GOOGLE_MAPS_API_KEY }}
        run: |
          set -euo pipefail
          KEY="${EXPO_PUBLIC_GOOGLE_MAPS_API_KEY:-}"
          if [ -n "$KEY" ]; then
            echo "Using EXPO_PUBLIC_GOOGLE_MAPS_API_KEY from GitHub Actions secrets."
          elif [ -n "${EXPO_TOKEN:-}" ]; then
            echo "GH Maps key empty — trying EAS project env…"
            for ENV_NAME in preview production development; do
              VAL="$(
                pnpm exec eas env:get "$ENV_NAME" \
                  --variable-name EXPO_PUBLIC_GOOGLE_MAPS_API_KEY \
                  --format short \
                  --non-interactive 2>/dev/null | tr -d '\r' || true
              )"
              if [ -n "${VAL:-}" ] && [ "$VAL" != "null" ]; then
                KEY="$VAL"
                echo "Resolved Maps key from EAS environment=${ENV_NAME}."
                break
              fi
            done
          fi
          if [ -z "${KEY:-}" ]; then
            echo "::error::EXPO_PUBLIC_GOOGLE_MAPS_API_KEY is required for staging Google pollen map."
            echo "Set repo secret EXPO_PUBLIC_GOOGLE_MAPS_API_KEY, or EAS Sensitive env + EXPO_TOKEN."
            echo "See docs/android-stage-build.md §C and docs/gcp-pollen-maps-keys.md"
            exit 1
          fi
          {
            echo "EXPO_PUBLIC_GOOGLE_MAPS_API_KEY<<EOF"
            echo "$KEY"
            echo "EOF"
          } >> "$GITHUB_ENV"

      - name: Prebuild Android (inject Google Maps key via app.config.js)
        working-directory: apps/mobile
        run: npx expo prebuild --platform android --clean --no-install

      - name: Assemble release APK
        working-directory: apps/mobile/android
        # Job/workflow EXPO_PUBLIC_* + resolved Maps key (GITHUB_ENV) must be present
        # when Metro bundles JS during assembleRelease.
        run: ./gradlew assembleRelease --no-daemon

      - name: Stage APK
        id: stage
        run: |
          mkdir -p dist
          SHORT_SHA="$(echo '${{ github.sha }}' | cut -c1-7)"
          if [[ "${{ github.ref_type }}" == "tag" ]]; then
            NAME="AllerGuide-staging-${{ github.ref_name }}-${SHORT_SHA}.apk"
          else
            NAME="AllerGuide-staging-${{ github.run_number }}-${SHORT_SHA}.apk"
          fi
          cp apps/mobile/android/app/build/outputs/apk/release/app-release.apk "dist/${NAME}"
          ls -lh dist/
          echo "apk_name=${NAME}" >> "$GITHUB_OUTPUT"

      - name: Upload artifact
        if: ${{ github.event_name == 'push' || inputs.upload_artifact }}
        uses: actions/upload-artifact@v4
        with:
          name: allerguide-staging-apk
          path: dist/*.apk
          if-no-files-found: error
          retention-days: 14

      - name: Publish GitHub Release (tag builds)
        if: startsWith(github.ref, 'refs/tags/android-staging-')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.apk
          name: A-Claro staging Android ${{ github.ref_name }}
          body: |
            Staging APK built from `${{ github.sha }}` via Gradle on GitHub Actions.

            - Profile env aligned with `eas.json` → `staging` (incl. Google pollen / plume / Yandex interactive)
            - Google Maps key injected from GH secret or EAS Sensitive env
            - API: `https://api.staging.aclearo.com`
            - Package: `com.aclearo.app` (CI/debug-style signing — internal testing only)
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
