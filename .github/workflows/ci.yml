name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Test
        run: pnpm test

      - name: Mobile unit test gate (P2.2d, ≥30)
        run: node scripts/mobile-test-gate.mjs

  api-integration:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: allerguide
          POSTGRES_PASSWORD: allerguide
          POSTGRES_DB: allerguide_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U allerguide -d allerguide_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Apply migrations
        env:
          DATABASE_URL: postgresql://allerguide:allerguide@localhost:5432/allerguide_test?sslmode=disable
          DIRECT_DATABASE_URL: postgresql://allerguide:allerguide@localhost:5432/allerguide_test?sslmode=disable
          DB_SSL: disable
        run: pnpm --filter api db:migrate

      - name: API integration tests (P1.6)
        env:
          DATABASE_URL: postgresql://allerguide:allerguide@localhost:5432/allerguide_test?sslmode=disable
          DIRECT_DATABASE_URL: postgresql://allerguide:allerguide@localhost:5432/allerguide_test?sslmode=disable
          DB_SSL: disable
          JWT_SECRET: ci-integration-test-jwt-secret-32chars
          SYNC_ENABLED: 'true'
          AI_SCAN_ENABLED: 'true'
          SCAN_REQUIRE_AUTH: 'true'
          RATE_LIMIT_DISABLED: 'true'
          OPENAI_API_KEY: test-openai-key
        run: pnpm --filter api test:integration
