# P2.1a — settings (/profile): emergency number
# After typing, the phone-pad IME hides profile-save-number (nightly 34052584781).
appId: com.aclearo.app
---
- runFlow: _offline-bootstrap.yaml
- tapOn:
    id: profile-header-button
- extendedWaitUntil:
    visible:
      id: profile-screen-title
    timeout: 10000
- scrollUntilVisible:
    element:
      id: profile-emergency-number
    direction: DOWN
    timeout: 20000
- tapOn:
    id: profile-emergency-number
- eraseText
- inputText: "112"
- runFlow: _tap-profile-save-number.yaml
- tapOn:
    text: OK
- assertVisible:
    id: profile-emergency-number
