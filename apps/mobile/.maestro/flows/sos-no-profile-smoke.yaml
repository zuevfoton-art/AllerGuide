# SOS emergency bar remains available after the last profile is removed
appId: com.aclearo.app
---
- runFlow: _offline-bootstrap.yaml
- tapOn:
    id: profile-header-button
- extendedWaitUntil:
    visible:
      id: profile-screen-title
    timeout: 10000
- tapOn:
    id: profile-delete
- tapOn:
    text: Удалить
- tapOn:
    id: tab-sos
- extendedWaitUntil:
    visible:
      id: sos-emergency-bar
    timeout: 10000
- assertVisible:
    id: sos-emergency-bar
# North-star N3: calling 103 and the numbered plan work without a profile.
- assertVisible:
    id: sos-crisis-call
- assertVisible:
    id: sos-crisis-plan
- assertVisible:
    id: sos-crisis-step-1
- assertVisible:
    text: Выберите профиль, чтобы увидеть медицинскую информацию
