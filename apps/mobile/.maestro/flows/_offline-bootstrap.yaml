# Shared subflow: fresh install → register → onboarding → home (offline preview)
appId: com.aclearo.app
---
- launchApp:
    clearState: true
- runFlow: _wait-login.yaml
- runFlow: _tap-register.yaml
- extendedWaitUntil:
    visible:
      id: auth-confirm-password-input
    timeout: 15000
- runScript: ../scripts/random-phone.js
- runFlow:
    file: _fill-by-id.yaml
    env:
      FIELD_ID: auth-login-input
      FIELD_VALUE: ${output.phone}
- runFlow:
    file: _fill-by-id.yaml
    env:
      FIELD_ID: auth-password-input
      FIELD_VALUE: maestro1
- runFlow:
    file: _fill-by-id.yaml
    env:
      FIELD_ID: auth-confirm-password-input
      FIELD_VALUE: maestro1
- runFlow:
    file: _tap-by-id.yaml
    env:
      FIELD_ID: auth-submit
- extendedWaitUntil:
    visible:
      id: onboarding-intro-skip
    timeout: 20000
- tapOn:
    id: onboarding-intro-skip
- extendedWaitUntil:
    visible:
      id: onboarding-scenario-self
    timeout: 10000
- tapOn:
    id: onboarding-scenario-self
- tapOn:
    id: profile-name
- inputText: Maestro Tester
- tapOn:
    id: profile-wizard-next
- tapOn:
    id: profile-birth-year
- inputText: "1990"
- tapOn:
    id: profile-wizard-next
# conditions (required)
- tapOn:
    id: condition-food
- tapOn:
    id: profile-wizard-next
# allergens (required)
- tapOn:
    id: allergen-milk
- tapOn:
    id: profile-wizard-next
# cross-reactions is the last first-run step; the rest moved to profile editing
- tapOn:
    id: profile-save
- extendedWaitUntil:
    visible:
      id: tab-home
    timeout: 20000
