# Shared subflow: fresh install → register → onboarding → home (offline preview).
# Does not dismiss first-run hints — callers that need a clear UI run `_dismiss-hints.yaml`.
appId: com.aclearo.app
---
- launchApp:
    clearState: true
- runFlow: _wait-login.yaml
- runFlow: _tap-register.yaml
- extendedWaitUntil:
    visible:
      id: auth-confirm-password-input
    timeout: 15000
- runScript: ../scripts/random-phone.js
# Register password must satisfy MIN_NEW_PASSWORD_LENGTH + 3 character classes
# (legacy 8-char lowercase+digit value is rejected). Staging uses SmokeTest1!.
- runFlow:
    file: _fill-by-id.yaml
    env:
      FIELD_ID: auth-login-input
      FIELD_VALUE: ${output.phone}
- runFlow:
    file: _fill-by-id.yaml
    env:
      FIELD_ID: auth-password-input
      FIELD_VALUE: Maestro1!
- runFlow:
    file: _fill-by-id.yaml
    env:
      FIELD_ID: auth-confirm-password-input
      FIELD_VALUE: Maestro1!
- runFlow:
    file: _tap-by-id.yaml
    env:
      FIELD_ID: auth-submit
# Register hashes the password with pure-JS PBKDF2 on Hermes (seconds, not ms).
- extendedWaitUntil:
    visible:
      id: onboarding-intro-skip
    timeout: 60000
- tapOn:
    id: onboarding-intro-skip
- extendedWaitUntil:
    visible:
      id: onboarding-scenario-self
    timeout: 10000
- tapOn:
    id: onboarding-scenario-self
- runFlow:
    file: _complete-first-run-profile.yaml
    env:
      PROFILE_NAME: Maestro Tester
- extendedWaitUntil:
    visible:
      id: tab-home
    timeout: 20000
