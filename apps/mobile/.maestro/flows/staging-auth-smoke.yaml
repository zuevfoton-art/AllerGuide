# P2.1b — staging: logout → login with backend JWT
appId: com.aclearo.app
---
- runFlow: _staging-bootstrap.yaml
- tapOn:
    id: profile-header-button
- extendedWaitUntil:
    visible:
      id: profile-screen-title
    timeout: 10000
- scrollUntilVisible:
    element:
      id: profile-logout
    direction: DOWN
    timeout: 20000
- tapOn:
    id: profile-logout
- tapOn:
    text: "Выйти"
- extendedWaitUntil:
    visible:
      id: auth-submit
    timeout: 15000
# Zip AuthHero (logo + padding) + Gboard hides auth-password-input
# after typing email (nightly 35498846516). Same fill helper as bootstrap.
- runFlow:
    file: _fill-by-id.yaml
    env:
      FIELD_ID: auth-login-input
      FIELD_VALUE: ${output.email}
- runFlow:
    file: _fill-by-id.yaml
    env:
      FIELD_ID: auth-password-input
      FIELD_VALUE: ${output.password}
- runFlow:
    file: _tap-by-id.yaml
    env:
      FIELD_ID: auth-submit
- extendedWaitUntil:
    visible:
      id: tab-home
    timeout: 45000
