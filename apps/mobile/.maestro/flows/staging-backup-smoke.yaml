# P2.1b — staging: recovery key setup + encrypted backup upload
appId: com.aclearo.app
---
- runFlow: _staging-bootstrap.yaml
- tapOn:
    id: profile-header-button
- extendedWaitUntil:
    visible:
      id: profile-screen-title
    timeout: 10000
- scrollUntilVisible:
    element:
      id: cloud-backup-upload
- tapOn:
    id: cloud-backup-upload
- extendedWaitUntil:
    visible:
      id: recovery-key-confirm
    timeout: 10000
- tapOn:
    id: recovery-key-saved-ack
- waitForAnimationToEnd:
    timeout: 3000
- tapOn:
    id: recovery-key-confirm
    enabled: true
# CloudBackupCard posts a status banner (not Alert «Готово»).
- extendedWaitUntil:
    visible:
      id: status-banner
    timeout: 60000
- assertVisible:
    text: "Резервная копия отправлена на сервер."
- tapOn:
    id: status-banner-dismiss
- assertVisible:
    id: cloud-backup-upload
