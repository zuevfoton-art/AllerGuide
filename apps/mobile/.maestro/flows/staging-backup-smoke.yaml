# P2.1b — staging: recovery key setup + encrypted backup upload
# Nightly 34451477109: Alert «Готово» is gone — success is StatusBanner
# (`settings.uploadSuccess`). Wait for that copy, not any banner and not «Готово».
appId: com.aclearo.app
---
- runFlow: _staging-bootstrap.yaml
- tapOn:
    id: profile-header-button
- extendedWaitUntil:
    visible:
      id: profile-screen-title
    timeout: 10000
- scrollUntilVisible:
    element:
      id: cloud-backup-upload
- tapOn:
    id: cloud-backup-upload
- extendedWaitUntil:
    visible:
      id: recovery-key-confirm
    timeout: 10000
- tapOn:
    id: recovery-key-saved-ack
- tapOn:
    id: recovery-key-confirm
- extendedWaitUntil:
    visible:
      id: status-banner-message
      text: "Резервная копия отправлена на сервер."
    timeout: 60000
- tapOn:
    id: status-banner-dismiss
- assertVisible:
    id: cloud-backup-upload
