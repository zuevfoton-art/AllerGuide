# Scroll a control on-screen, then tap. Fold IME first so the target is
# not covered. Do not use hideKeyboard (BACK at /login exits the app).
appId: com.aclearo.app
---
- runFlow: _dismiss-ime.yaml
- scrollUntilVisible:
    element:
      id: ${FIELD_ID}
    direction: DOWN
    timeout: 20000
- tapOn:
    id: ${FIELD_ID}
