# Hero title sits at the top of the login ScrollView — Maestro sees Text
# testIDs reliably. The unified login field is `auth-login-input`.
appId: com.aclearo.app
---
- waitForAnimationToEnd:
    timeout: 15000
- extendedWaitUntil:
    visible:
      id: auth-hero-title
    timeout: 120000
- takeScreenshot: maestro-login-visible
