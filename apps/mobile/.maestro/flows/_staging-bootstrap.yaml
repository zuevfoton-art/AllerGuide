# Shared subflow: staging register (email + API) → onboarding → home
appId: com.aclearo.app
---
- launchApp:
    clearState: true
# Login input is above the fold; register link may need a scroll on Pixel 6.
# Release first launch on CI can exceed 30s (Hermes + SQLite init).
- extendedWaitUntil:
    visible:
      id: auth-login-input
    timeout: 90000
- scrollUntilVisible:
    element:
      id: auth-register-link
    direction: DOWN
    timeout: 15000
- tapOn:
    id: auth-register-link
- tapOn:
    id: auth-mode-email
- runScript: ../scripts/staging-credentials.js
- tapOn:
    id: auth-login-input
- inputText: ${output.email}
- tapOn:
    id: auth-password-input
- inputText: ${output.password}
- tapOn:
    id: auth-confirm-password-input
- inputText: ${output.password}
- tapOn:
    id: auth-submit
- extendedWaitUntil:
    visible:
      id: onboarding-intro-skip
    timeout: 45000
- tapOn:
    id: onboarding-intro-skip
- extendedWaitUntil:
    visible:
      id: onboarding-scenario-self
    timeout: 10000
- tapOn:
    id: onboarding-scenario-self
- tapOn:
    id: profile-name
- inputText: Maestro Staging
- tapOn:
    id: profile-wizard-next
- tapOn:
    id: profile-birth-year
- inputText: "1990"
- tapOn:
    id: profile-wizard-next
- tapOn:
    id: profile-wizard-next
- tapOn:
    id: allergen-milk
- tapOn:
    id: profile-wizard-next
- tapOn:
    id: profile-save
- extendedWaitUntil:
    visible:
      id: tab-home
    timeout: 30000
