# Shared subflow: staging register (email + API) → onboarding → home.
# First-run profile wizard is 5 screens (same as `_offline-bootstrap.yaml`).
appId: com.aclearo.app
---
- launchApp:
    clearState: true
- runFlow: _wait-login.yaml
- runFlow: _tap-register.yaml
- extendedWaitUntil:
    visible:
      id: auth-confirm-password-input
    timeout: 15000
- runScript: ../scripts/staging-credentials.js
- runFlow:
    file: _fill-by-id.yaml
    env:
      FIELD_ID: auth-login-input
      FIELD_VALUE: ${output.email}
- runFlow:
    file: _fill-by-id.yaml
    env:
      FIELD_ID: auth-password-input
      FIELD_VALUE: ${output.password}
- runFlow:
    file: _fill-by-id.yaml
    env:
      FIELD_ID: auth-confirm-password-input
      FIELD_VALUE: ${output.password}
- runFlow:
    file: _tap-by-id.yaml
    env:
      FIELD_ID: auth-submit
- extendedWaitUntil:
    visible:
      id: onboarding-intro-skip
    timeout: 45000
- tapOn:
    id: onboarding-intro-skip
- extendedWaitUntil:
    visible:
      id: onboarding-scenario-self
    timeout: 10000
- tapOn:
    id: onboarding-scenario-self
- tapOn:
    id: profile-name
- inputText: Maestro Staging
- tapOn:
    id: profile-wizard-next
- tapOn:
    id: profile-birth-year
- inputText: "1990"
- tapOn:
    id: profile-wizard-next
- tapOn:
    id: profile-wizard-next
- tapOn:
    id: allergen-milk
- tapOn:
    id: profile-wizard-next
- tapOn:
    id: profile-save
- extendedWaitUntil:
    visible:
      id: tab-home
    timeout: 30000
