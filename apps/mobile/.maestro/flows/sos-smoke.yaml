# P2.1a — SOS: zip passport card + detailed passport collapse
# The zip card (sos-profile-card) is always open. sos-passport-toggle is the
# older detailed section below the crisis plan (nightly 35507872138).
appId: com.aclearo.app
---
- runFlow: _offline-bootstrap.yaml
- tapOn:
    id: tab-sos
- extendedWaitUntil:
    visible:
      id: sos-profile-card
    timeout: 10000
- assertVisible:
    text: Maestro Tester
- assertVisible:
    id: sos-crisis-plan
- scrollUntilVisible:
    element:
      id: sos-passport-toggle
    direction: DOWN
    timeout: 20000
- tapOn:
    id: sos-passport-toggle
- assertVisible:
    id: sos-passport-toggle
