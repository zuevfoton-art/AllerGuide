# §7.3 — diary: dish breakdown checklist (offline catalog)
appId: com.aclearo.app
---
- runFlow: _offline-bootstrap.yaml
- tapOn:
    id: tab-diary
- tapOn:
    id: diary-new-entry
- tapOn:
    id: diary-picker-food
- tapOn:
    id: nutrition-enter-manual
- extendedWaitUntil:
    visible:
      id: diary-wizard-primary
    timeout: 10000
# food text
- tapOn:
    id: diary-field-food
- inputText: борщ
- tapOn:
    id: diary-wizard-primary
# foodComponents checklist (local catalog; OFF enrichment optional)
- extendedWaitUntil:
    visible:
      id: diary-dish-checklist
    timeout: 15000
- tapOn:
    id: diary-dish-component-beet
- tapOn:
    id: diary-wizard-primary
# reaction level and type share the last screen
- tapOn:
    text: "Нет реакции"
- tapOn:
    id: diary-wizard-primary
- extendedWaitUntil:
    notVisible:
      id: diary-wizard-primary
    timeout: 10000
- assertVisible:
    id: diary-new-entry
