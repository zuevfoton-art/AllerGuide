# §7.3 — diary: dish breakdown checklist (offline catalog)
appId: com.aclearo.app
---
- runFlow: _offline-bootstrap.yaml
- tapOn:
    id: tab-diary
- tapOn:
    id: diary-new-entry
- tapOn:
    id: diary-picker-food
# The capture sheet gained a barcode button (#311) — wait for it to mount
# instead of tapping into an animating sheet.
- extendedWaitUntil:
    visible:
      id: nutrition-capture-step
    timeout: 10000
- tapOn:
    id: nutrition-enter-manual
- extendedWaitUntil:
    visible:
      id: diary-wizard-primary
    timeout: 10000
# food text
- runFlow:
    file: _fill-wizard-field.yaml
    env:
      FIELD_ID: diary-field-food
      FIELD_VALUE: борщ
- runFlow: _tap-wizard-primary.yaml
# foodComponents checklist (local catalog; OFF enrichment optional)
- extendedWaitUntil:
    visible:
      id: diary-dish-checklist
    timeout: 15000
- tapOn:
    id: diary-dish-component-beet
- runFlow: _tap-wizard-primary.yaml
# reaction level and type share the last screen
- tapOn:
    text: "Нет реакции"
- runFlow: _tap-wizard-primary.yaml
- extendedWaitUntil:
    notVisible:
      id: diary-wizard-primary
    timeout: 10000
- assertVisible:
    id: diary-new-entry
