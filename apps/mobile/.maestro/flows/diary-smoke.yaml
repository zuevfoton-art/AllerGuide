# P2.1a — diary: new entry → symptoms (offline)
appId: com.aclearo.app
---
- runFlow: _offline-bootstrap.yaml
- tapOn:
    id: tab-diary
- tapOn:
    id: diary-new-entry
- tapOn:
    id: diary-picker-symptoms
# «Далее» is the last child of the scrolling wizard, so on Pixel 6 it mounts
# below the fold and stays disabled until the step is filled — it never turns
# visible here (nightly 34325395361: bounds [87,2373][993,2358], enabled=false).
# The step label sits at the top of the wizard, so it is the mount signal.
- extendedWaitUntil:
    visible:
      id: diary-wizard-step-label
    timeout: 10000
# Catalog picker and free text share one screen
- runFlow:
    file: _fill-wizard-field.yaml
    env:
      FIELD_ID: diary-field-symptoms
      FIELD_VALUE: зуд
- runFlow: _tap-wizard-primary.yaml
# severity
- tapOn:
    text: "1 — лёгкая"
- runFlow: _tap-wizard-primary.yaml
# onset (optional) — save
- runFlow: _tap-wizard-primary.yaml
- extendedWaitUntil:
    notVisible:
      id: diary-wizard-step-label
    timeout: 10000
- assertVisible:
    id: diary-new-entry
