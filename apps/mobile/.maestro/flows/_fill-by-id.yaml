# Scroll a field on-screen, type, then fold the IME.
# Pixel 6 + AuthHero + keyboard otherwise hides confirm/password/submit.
# Do not use hideKeyboard — it sends BACK and pops /login (root).
appId: com.aclearo.app
---
- runFlow: _dismiss-ime.yaml
- scrollUntilVisible:
    element:
      id: ${FIELD_ID}
    direction: DOWN
    timeout: 20000
- tapOn:
    id: ${FIELD_ID}
- inputText: ${FIELD_VALUE}
- runFlow: _dismiss-ime.yaml
