# P2.1a — onboarding: register → intro skip → profile → home → first-run hints
appId: com.aclearo.app
---
- runFlow: _offline-bootstrap-until-home.yaml
- extendedWaitUntil:
    visible:
      id: hint-overlay
    timeout: 20000
- assertVisible:
    id: hint-skip
- runFlow: _dismiss-hints.yaml
- assertNotVisible:
    id: hint-overlay
- assertVisible:
    id: tab-home
- assertVisible:
    id: tab-diary
- assertVisible:
    id: tab-scanner
- assertVisible:
    id: tab-map
- assertVisible:
    id: tab-sos
# North-star N1: four navigation tabs + SOS control, market moved to the profile hub.
- assertNotVisible:
    id: tab-market
