# Fold IME, bring a wizard choice chip on-screen, tap it.
# Nightly 34336499730: after pinning diary-editor-footer, itching chips
# ("Слабый") sit under Gboard with inverted bounds and tapOn text fails.
# Nightly 34946086211: IME still up after title tap; wait until the chip is
# actually visible (not merely in the hierarchy) before tapping.
appId: com.aclearo.app
---
- runFlow: _dismiss-wizard-ime.yaml
- extendedWaitUntil:
    visible:
      id: ${CHOICE_ID}
    timeout: 15000
- scrollUntilVisible:
    element:
      id: ${CHOICE_ID}
    direction: DOWN
    timeout: 20000
- tapOn:
    id: ${CHOICE_ID}
