# Fold IME, bring a wizard choice chip on-screen, tap it.
# Nightly 34336499730: after pinning diary-editor-footer, itching chips
# ("Слабый") sit under Gboard with inverted bounds and tapOn text fails.
# Nightly 34956812041: wait-for-visible ran before scroll while Gboard still
# covered the chip; Maestro never reached scrollUntilVisible. Scroll first.
appId: com.aclearo.app
---
- runFlow: _dismiss-wizard-ime.yaml
- scrollUntilVisible:
    element:
      id: ${CHOICE_ID}
    direction: DOWN
    timeout: 20000
- extendedWaitUntil:
    visible:
      id: ${CHOICE_ID}
    timeout: 15000
- tapOn:
    id: ${CHOICE_ID}
