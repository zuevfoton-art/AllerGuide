# Fold IME on the diary editor without BACK / hideKeyboard.
# Tap pinned modal chrome (outside the ScrollView). The title Pressable
# calls Keyboard.dismiss() — a plain View tap does not blur Android IME
# (nightly 34349155324). The wizard step label can crush under the status
# bar when Gboard is open (nightly 33736400731), so do not tap that.
appId: com.aclearo.app
---
- tapOn:
    id: diary-editor-title
- waitForAnimationToEnd:
    timeout: 3000
