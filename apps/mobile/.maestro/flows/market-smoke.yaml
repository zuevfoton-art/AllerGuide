# P2 — market: two-column catalog with photos
appId: com.aclearo.app
---
- runFlow: _offline-bootstrap.yaml
# Market is no longer a tab: it lives in the profile hub (north-star N1).
- tapOn:
    id: profile-header-button
- tapOn:
    id: profile-switcher-manage
- tapOn:
    id: hub-market
- extendedWaitUntil:
    visible:
      id: market-grid
    timeout: 15000
- assertVisible:
    id: market-search
- assertVisible:
    id: market-filters
- tapOn:
    id: market-filter-pharmacy
- assertVisible:
    id: market-card-cetirizine-otc
