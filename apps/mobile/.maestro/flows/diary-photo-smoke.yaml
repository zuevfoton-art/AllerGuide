# §7.3 — diary: skin photo step is reachable (gallery/camera UI)
# Does not require actually picking a photo (permission-dependent on CI).
appId: com.aclearo.app
---
- runFlow: _offline-bootstrap.yaml
- tapOn:
    id: tab-diary
- tapOn:
    id: diary-chip-skin
- extendedWaitUntil:
    visible:
      id: diary-wizard-primary
    timeout: 10000
# skinArea + appearance + itching share one screen
- runFlow:
    file: _fill-wizard-field.yaml
    env:
      FIELD_ID: diary-field-skinArea
      FIELD_VALUE: лицо
- runFlow:
    file: _fill-wizard-field.yaml
    env:
      FIELD_ID: diary-field-appearance
      FIELD_VALUE: покраснение
- tapOn:
    text: "Слабый"
- runFlow: _tap-wizard-primary.yaml
# photo step
- extendedWaitUntil:
    visible:
      id: diary-photo-step
    timeout: 10000
- assertVisible:
    id: diary-photo-library
# Skip photos (optional) and finish notes
- runFlow: _tap-wizard-primary.yaml
- runFlow: _tap-wizard-primary.yaml
- extendedWaitUntil:
    notVisible:
      id: diary-wizard-primary
    timeout: 10000
- assertVisible:
    id: diary-chip-skin
